# Publishes a release when a version tag (v1.2.3) is pushed:
# 1. checks the tag against the version in module.json, and that every file the manifest loads exists;
# 2. fills in this repository's links (manifest, download, issues, readme, changelog) and the manifests of the family's
#    other modules, which live in repositories named after their ids under the same owner;
# 3. zips the module (without the tests and repository files) and attaches module.json and module.zip to a GitHub
#    release, with this version's section of CHANGELOG.md as its notes.
name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out
        uses: actions/checkout@v6

      - name: Prepare module.json and the release notes
        run: node .github/scripts/prepare-release.mjs "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY"

      - name: Build module.zip
        run: zip -r module.zip . -x ".git/*" ".github/*" "tests/*" ".gitignore" ".gitattributes" "release-notes.md"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="$(node -p "const m = require('./module.json'); m.title + ' ' + m.version")"
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" module.json module.zip --clobber
          else
            gh release create "$GITHUB_REF_NAME" module.json module.zip --verify-tag --title "$TITLE" --notes-file release-notes.md
          fi
